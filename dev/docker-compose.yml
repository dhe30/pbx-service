# Local dev stack (CLAUDE.md §5, phase 2). Not used in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pbx
      POSTGRES_PASSWORD: pbx
      POSTGRES_DB: pbx
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]

  # S3-compatible object store, same as production (Garage v2.5.0, group_vars garage_version).
  # One-time setup after the first `up`: npm run dev:s3
  garage:
    image: dxflrs/garage:v2.5.0
    ports: ["127.0.0.1:3900:3900"]          # S3 API only; RPC and admin stay inside the container
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data

  # TODO: api and web services once implemented (build from services/*/Dockerfile).
