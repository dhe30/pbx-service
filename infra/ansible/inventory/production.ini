# Course cloud (Clanode) deployment, the default inventory (ansible.cfg). Layout: CLAUDE.md §4.1;
# group/host names and variables are part of the shared contract (docs/split-contracts.md §2).
# Fill in the addresses after creating the VMs (docs/cloud-deploy.md §5). IPs aren't secrets;
# secrets go only in the encrypted group_vars/all/vault.yml.
#
# Clanode gives VMs only a private IP: add a public IPv4 to the two edges. Every other VM is reached
# through edge-1 as an SSH jump host (ProxyJump below), so edge-1 must be up to deploy the others.
#
# Precedence trap: variables under [group:vars] here LOSE to group_vars/all/main.yml (they only
# beat role defaults). To override anything set in main.yml, use an inline host var or -e
# (split-contracts.md §8). The API settings (DID provider, trunk group) are in main.yml.

# Order matters: edge-1 -> trunk edge-a, edge-2 -> edge-b (don't reorder on a live system).
# public_bind_ip = the local address the public IP arrives at. Clanode uses 1:1 NAT onto the VM's
# only (private) address (verify-backlog V-P10: `ip -4 addr` shows just 10.0.x.x), so it is the
# private IP. Kamailio, rtpengine and HAProxy bind it and advertise public_ip.
[edge]
edge-1 ansible_host=130.245.136.131 public_ip=130.245.136.131 private_ip=10.0.1.13 public_bind_ip=10.0.1.13
edge-2 ansible_host=130.245.136.155 public_ip=130.245.136.155 private_ip=10.0.0.42 public_bind_ip=10.0.0.42

[pbx]
pbx-1 ansible_host=10.0.1.214 private_ip=10.0.1.214
pbx-2 ansible_host=10.0.0.91 private_ip=10.0.0.91

[app]
app-1 ansible_host=10.0.1.7 private_ip=10.0.1.7
app-2 ansible_host=10.0.3.162 private_ip=10.0.3.162

# 3 nodes from the start: Garage's replication factor (= number of db hosts, max 3) is fixed once
# data is stored, and etcd/Patroni need an odd count.
[db]
db-1 ansible_host=10.0.1.123 private_ip=10.0.1.123
db-2 ansible_host=10.0.0.255 private_ip=10.0.0.255
db-3 ansible_host=10.0.0.122 private_ip=10.0.0.122

# Monitoring + backups (roles still stubs). Add mon-1 here once T4 lands.
[mon]

# Nodes that run the local DB/S3 proxy (127.0.0.1:5432/5433/3900, role db_local_proxy).
[db_clients:children]
edge
pbx
app

[all:vars]
ansible_user=root

# Private-only VMs: SSH through edge-1's public IP.
[pbx:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'
[db:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'

[app:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'
# API settings (did_provider_url, did_trunk_group_id / did_trunk_id, stripe_*) live in
# group_vars/all/main.yml, NOT here: main.yml defines them, so values here would lose to it.
