# Course cloud (Clanode) deployment, the default inventory (ansible.cfg). Layout: CLAUDE.md §4.1;
# group/host names and variables are part of the shared contract (docs/split-contracts.md §2).
# Fill in the addresses after creating the VMs (docs/cloud-deploy.md §5). IPs aren't secrets;
# secrets go only in the encrypted group_vars/all/vault.yml.
#
# Clanode gives VMs only a private IP: add a public IPv4 to the two edges. Every other VM is reached
# through edge-1 as an SSH jump host (ProxyJump below), so edge-1 must be up to deploy the others.
#
# Precedence trap: variables under [group:vars] here LOSE to group_vars/all/main.yml (they only
# beat role defaults). To override anything set in main.yml, use an inline host var or -e
# (split-contracts.md §8). The API settings (DID provider, trunk group) are in main.yml.

# Order matters: edge-1 -> trunk edge-a, edge-2 -> edge-b (don't reorder on a live system).
# public_bind_ip = the local address the public IP arrives at. Clanode uses 1:1 NAT onto the VM's
# only (private) address (verify-backlog V-P10: `ip -4 addr` shows just 10.0.x.x), so it is the
# private IP. Kamailio, rtpengine and HAProxy bind it and advertise public_ip.
[edge]
edge-1 ansible_host=130.245.136.131 public_ip=130.245.136.131 private_ip=10.0.1.13 public_bind_ip=10.0.1.13
edge-2 ansible_host=130.245.136.155 public_ip=130.245.136.155 private_ip=10.0.0.42 public_bind_ip=10.0.0.42

[pbx]
pbx-1 ansible_host=10.0.1.214 private_ip=10.0.1.214
# 2026-11-17..24: was limited to 100 calls on 2 vCPU (the account hash put the largest accounts here;
# load 6-8 at 120+ calls). Override removed for the 2026-11-24 resize of pbx-1..3 to 16G
# (pbx-resize.yml): maxcalls = 80 x vCPUs again. Until pbx-2 is resized, don't run site.yml on it
# (it would get 160 on 2 vCPU).
pbx-2 ansible_host=10.0.0.91 private_ip=10.0.0.91
# 2 vCPU / 4 GB (added 2026-11-15 so a drained node leaves two in service; maxcalls 160).
pbx-3 ansible_host=10.0.1.0 private_ip=10.0.1.0
# 4 vCPU / 8 GB (maxcalls 320 = 80 x vCPUs), added 2026-11-23 during the Monday peak: pbx-1..3 sat
# at their caps (160/100/160) from ~12:15 UTC and every further call got 503 (~150 failures/min).
pbx-4 ansible_host=10.0.3.90 private_ip=10.0.3.90
pbx-5 ansible_host=10.0.1.220 private_ip=10.0.1.220

[app]
app-1 ansible_host=10.0.1.7 private_ip=10.0.1.7
app-2 ansible_host=10.0.3.162 private_ip=10.0.3.162

# 3 nodes from the start: Garage's replication factor (= number of db hosts, max 3) is fixed once
# data is stored, and etcd/Patroni need an odd count.
[db]
db-1 ansible_host=10.0.1.123 private_ip=10.0.1.123
db-2 ansible_host=10.0.0.255 private_ip=10.0.0.255
db-3 ansible_host=10.0.0.122 private_ip=10.0.0.122

# Monitoring + backups (Prometheus, Grafana, Alertmanager, pgBackRest repository). Private IP only.
# Example: mon-1 ansible_host=10.0.x.x private_ip=10.0.x.x
[mon]
mon-1 ansible_host=10.0.1.81 private_ip=10.0.1.81

# Dedicated media nodes (rtpengine only; README 2.4 "Adding media nodes"). Public IP like the edges
# (1:1 NAT: public_bind_ip = private_ip; checked 2026-11-15: ens3 has only the private IP); cloud
# firewall: SSH + UDP 30000-40000 public, UDP 2223 from the edges, TCP 2225/9100 from mon-1. Filled
# in, then follow the runbook ORDER (media, then firewall.yml on the others, then edge). 2 vCPU / 4 GB.
[media]
media-1 ansible_host=130.245.136.159 public_ip=130.245.136.159 private_ip=10.0.2.222 public_bind_ip=10.0.2.222 rtp_sets=1,2 rtp_weight=1
media-2 ansible_host=130.245.136.139 public_ip=130.245.136.139 private_ip=10.0.0.229 public_bind_ip=10.0.0.229 rtp_sets=1,2 rtp_weight=1
# 4 vCPU / 8 GB, added 2026-11-17 during the morning peak (media-1/2 ran at ~72 % CPU all day).
media-3 ansible_host=130.245.136.137 public_ip=130.245.136.137 private_ip=10.0.0.161 public_bind_ip=10.0.0.161 rtp_sets=1,2 rtp_weight=2
# 4 vCPU / 8 GB each, added 2026-11-23 (media-1..3 at ~85 % CPU through the Monday peak).
media-4 ansible_host=130.245.136.172 public_ip=130.245.136.172 private_ip=10.0.1.142 public_bind_ip=10.0.1.142 rtp_sets=1,2 rtp_weight=2
media-5 ansible_host=130.245.136.227 public_ip=130.245.136.227 private_ip=10.0.2.22 public_bind_ip=10.0.2.22 rtp_sets=1,2 rtp_weight=2
# 8 vCPU / 16 GB each, added 2026-11-25 (media-1..5 the bottleneck at peak; per-node disk stalls,
# so two medium nodes rather than one 16 vCPU node). Public IPs in 130.245.168.0/24, not .136.
media-6 ansible_host=130.245.168.243 public_ip=130.245.168.243 private_ip=10.0.2.90 public_bind_ip=10.0.2.90 rtp_sets=2 rtp_weight=4
media-7 ansible_host=130.245.168.216 public_ip=130.245.168.216 private_ip=10.0.0.113 public_bind_ip=10.0.0.113 rtp_sets=2 rtp_weight=4
# Media set generations (rtp_sets, README 2.4 "Adding a node to a live media group"): set 1 =
# media-1..5 unweighted, exactly as before media-6/7 (its calls in progress keep hashing over it);
# set 2 = all seven, weighted by vCPU (rtp_weight 1 per 2 vCPU: 2/4/8 vCPU -> 1/2/4), for new calls
# once `kamcmd cfg.set_now_int pbx media_rtp 2` runs on both edges. Never change a set's members
# or weights while calls use it: the next change starts set 3.

# Nodes that run the local DB/S3 proxy (127.0.0.1:5432/5433/3900, role db_local_proxy).
[db_clients:children]
edge
pbx
app

[all:vars]
ansible_user=root

# Private-only VMs: SSH through edge-1's public IP.
[pbx:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'
[db:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'
# 250 GB Volume per db node (2026-11-23), ext4 mounted here via fstab (UUID, nofail).
garage_volume_data_dir=/var/lib/garage/data2
[mon:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'

[app:vars]
ansible_ssh_common_args='-o ProxyJump=root@130.245.136.131'
# API settings (did_provider_url, did_trunk_group_id / did_trunk_id, stripe_*) live in
# group_vars/all/main.yml, NOT here: main.yml defines them, so values here would lose to it.
