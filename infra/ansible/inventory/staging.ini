# Split deployment (CLAUDE.md §4.1): 10 VMs. Group names, host names and variables are part of
# the shared contract (docs/split-contracts.md §2). Replace the example addresses after creating
# the VMs: 10.0.0.x = private IPs, 203.0.113.x = public IPs (documentation range).
#
# Every host needs private_ip. Edge hosts also need public_ip (add public_bind_ip if the public
# IP is NATed onto the VM instead of being on its interface).
# Order matters for edge: edge-1 -> trunk edge-a, edge-2 -> edge-b (don't reorder on a live system).

[edge]
edge-1 ansible_host=203.0.113.11 public_ip=203.0.113.11 private_ip=10.0.0.11
edge-2 ansible_host=203.0.113.12 public_ip=203.0.113.12 private_ip=10.0.0.12

# No public IPs below: reach them through an edge (or mon-1) as an SSH jump host, e.g.
#   ansible_ssh_common_args='-o ProxyJump=root@203.0.113.11'
[pbx]
pbx-1 ansible_host=10.0.0.21 private_ip=10.0.0.21
pbx-2 ansible_host=10.0.0.22 private_ip=10.0.0.22

[app]
app-1 ansible_host=10.0.0.31 private_ip=10.0.0.31
app-2 ansible_host=10.0.0.32 private_ip=10.0.0.32

[db]
db-1 ansible_host=10.0.0.41 private_ip=10.0.0.41
db-2 ansible_host=10.0.0.42 private_ip=10.0.0.42
db-3 ansible_host=10.0.0.43 private_ip=10.0.0.43

[mon]
mon-1 ansible_host=10.0.0.51 private_ip=10.0.0.51

# Nodes that run the local DB proxy (127.0.0.1:5432 -> Patroni primary) and the local S3 proxy.
[db_clients:children]
edge
pbx
app

# Garage keeps 3 copies automatically here (garage_replication_factor = number of db hosts, max 3).
#
# Don't put overrides under [group:vars] in this file: group_vars/all/main.yml beats them.
# TEMPORARY, until the data-tier track (T1) has merged db_local_proxy, point clients straight at
# a single Postgres on db-1 with an extra var (docs/split-contracts.md §8):
#   ansible-playbook -i inventory/staging.ini site.yml --ask-vault-pass -e db_host=10.0.0.41

[all:vars]
ansible_user=root
