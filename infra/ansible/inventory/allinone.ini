# Phase 1: everything on ONE VM. Every role group points at the same host, so the same roles and
# templates are used as in the split deployment (phase 4 = change this inventory, not the roles).
#
# Requirements for the VM: Debian 13 (or 12), 2+ vCPU, 4 GB RAM, a public IPv4 AND a private IP
# (rtpengine needs two distinct addresses for its internal/external interfaces).
#
# Fill in the IPs. If the provider NATs the public IP (it is not on the VM's interface), also set
# public_bind_ip=<the VM's local address that the public IP maps to>.

[edge]
# asterisk_sip_port=5080: Kamailio already owns private_ip:5060 on this host.
pbx-aio ansible_host=PUBLIC_IP public_ip=PUBLIC_IP private_ip=PRIVATE_IP asterisk_sip_port=5080

[pbx]
pbx-aio

[db]
pbx-aio

[app]
# no API yet in phase 1

[mon]

[db_clients:children]
edge
pbx

[all:vars]
ansible_user=root
