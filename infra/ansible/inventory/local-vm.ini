# Phase 1 all-in-one on a LOCAL VirtualBox VM (docs/local-vm.md). Same roles as allinone.ini.
#
# The VM has two adapters, standing in for a cloud VM's public + private IPs:
#   public_ip  = Host-only adapter (192.168.56.x): what the Windows host, its browser and its
#                softphone (the fake carrier) talk to.
#   private_ip = NAT adapter (VirtualBox default 10.0.2.15): internal traffic only
#                (Kamailio <-> Asterisk <-> rtpengine "internal"), plus the VM's internet access.
# Check both with `ip -4 addr` on the VM and fix them here if they differ.
#
# carrier_cidrs: the Windows host as seen from the VM on the host-only network. Inline host vars
# override group_vars/all, so the shared main.yml stays untouched.

[edge]
pbx-aio ansible_host=192.168.56.10 public_ip=192.168.56.10 private_ip=10.0.2.15 asterisk_sip_port=5080 carrier_cidrs="['192.168.56.1']"

[pbx]
pbx-aio

[db]
pbx-aio

[app]
# no API yet in phase 1

[mon]

[db_clients:children]
edge
pbx

[all:vars]
ansible_user=root
