# Variables shared by every host. Secrets live in group_vars/all/vault.yml (ansible-vault encrypted).
# Per-host values (private_ip, public_ip, ...) live in the inventory.

# ---- Versions (pinned) -------------------------------------------------------------------------
# Target OS: Debian 13 (trixie) or 12 (bookworm). Repos below use the detected codename.
kamailio_version: "60"            # deb.kamailio.org/kamailio60 -> Kamailio 6.0.x
asterisk_version: "22.11.0"       # built from source (Asterisk is not packaged for Debian)
rtpengine_release: "26.0"         # rtpengine.dfx.at LTS line (built with transcoding + bcg729)
postgres_version: "16"            # apt.postgresql.org
garage_version: "v2.5.0"
etcd_version: "v3.5.21"           # github.com/etcd-io/etcd releases (Patroni DCS)
patroni_version: "4.0.5"          # PyPI, installed in a venv on the db hosts
dbmate_version: "v2.37.0"
node_major: "24"                  # Node.js LTS (20 reached end of life in April 2026)

# ---- Telephony ---------------------------------------------------------------------------------
# One SIP domain for all accounts (course spec §3): phones register at <group>.cse356... and find
# us through the _sip._udp / _sips._tcp SRV records published on the Group tab.
sip_domain: "group-4.cse356.compas.cs.stonybrook.edu"

# Carrier (DID provider) source addresses allowed to send INVITEs for our DIDs (Course Services tab:
# "Your inbound trunks receive INVITEs from the carrier, 130.245.136.142").
# Entries: "IP", "IP/bits", optionally ":port" to accept carrier calls only from that source port
# (needed when the fake carrier and test phones run on the same machine, e.g. "192.168.56.1:5062").
# Local testing: add the public IP of the machine running SIPp / your test softphone.
carrier_cidrs: ["130.245.136.142/32"]
# Sources of the course's simulated phones/customers: never rate-limited by pike (B2).
# [VERIFY] the real ranges from Kamailio logs once traffic is on; 130.245.136.0/24 holds the carrier.
trusted_tester_cidrs: ["130.245.136.0/24"]
# PSTN vendors (Course Services tab). Asterisk sends vendor legs through the edge to these hosts.
vendor_us_host: "us-vendor.cse356.compas.cs.stonybrook.edu"
vendor_intl_host: "intl-vendor.cse356.compas.cs.stonybrook.edu"
vendor_hosts: ["{{ vendor_us_host }}", "{{ vendor_intl_host }}"]
# How the dialed number goes in the vendor Request-URI user: e164 (+12015550123) or e164_noplus.
vendor_number_format: "e164"

kamailio_ws_port: 8080
# Kamailio's internal SIP socket (UDP, private IP): Asterisk, the peer edge and DMQ use it; 5060 is
# the internet-facing socket. Separate ports because behind 1:1 NAT (Clanode, verify-backlog V-P10)
# both sockets share the VM's only address, and each must advertise a different address.
kamailio_internal_port: 5070
# SIP over TLS for phones registered through _sips._tcp (SRTP-SDES media). Certificate for sip_domain.
kamailio_tls_port: 5061
kamailio_tls_cert: /etc/kamailio/tls/cert.pem
kamailio_tls_key: /etc/kamailio/tls/key.pem
# asterisk_sip_port: defaults to 5060 (asterisk role defaults). Set it as a HOST var to override
# (the all-in-one inventory uses 5080 because Kamailio already owns 5060 there).
ari_user: "pbxapp"
# Longest a staff member can hold a call that sends no audio (Asterisk rtp_timeout_hold), in s.
# Guards against a browser that closed while holding. Must stay below rtpengine silent-timeout.
hold_max_sec: 1800

# PJSIP trunk names toward the edges, in preference order: edge-a -> groups['edge'][0], ...
edge_trunk_names: "{{ ['edge-a', 'edge-b', 'edge-c', 'edge-d'][:groups['edge'] | length] }}"
# rtpengine instances: dedicated media nodes when the inventory has a `media` group (B3: media CPU off
# the signaling nodes), otherwise the edges.
rtpengine_ips: "{{ (groups.get('media') or groups['edge']) | map('extract', hostvars, 'private_ip') | list }}"
# Other edges, as seen from this host (empty for a single edge).
edge_peer_ips: "{{ groups['edge'] | map('extract', hostvars, 'private_ip') | reject('equalto', private_ip) | list }}"
# Where the public listeners bind. Same as public_ip unless the provider NATs the public IP
# (then set public_bind_ip to the VM's local address in the inventory).
public_bind_ip: "{{ public_ip | default(private_ip) }}"

# ---- Database ----------------------------------------------------------------------------------
db_name: "pbx"
db_app_user: "pbx_app"
db_kamailio_user: "kamailio"
# Every DB client talks to 127.0.0.1:5432: the local Postgres in phase 1, the local HAProxy in
# front of the Patroni primary later (CLAUDE.md §4.3 #7).
db_host: "127.0.0.1"
kamailio_db_url: "postgres://{{ db_kamailio_user }}:{{ vault_db_kamailio_password }}@{{ db_host }}:5432/{{ db_name }}"
# Kamailio only READS the database (auth, DID -> account). Clients use the local proxy's read-only
# port, which forwards to a replica (else any healthy member) so auth survives a primary failover.
# A host that is itself a db node (the all-in-one VM) has no local proxy: it uses Postgres directly.
db_ro_port: "{{ 5432 if inventory_hostname in groups['db'] else 5433 }}"
kamailio_db_ro_url: "postgres://{{ db_kamailio_user }}:{{ vault_db_kamailio_password }}@{{ db_host }}:{{ db_ro_port }}/{{ db_name }}"
app_db_url: "postgres://{{ db_app_user }}:{{ vault_db_app_password }}@{{ db_host }}:5432/{{ db_name }}"

# ---- Object store (Garage) ---------------------------------------------------------------------
s3_bucket: "pbx-media"
s3_region: "garage"
s3_port: 3900
# Copies of every object: one per db node, at most 3 (1 on the all-in-one VM, 3 on db-1..3).
# Must be right before Garage stores data; changing it later is a migration.
garage_replication_factor: "{{ [groups['db'] | length, 3] | min }}"
# Clients use their local S3 proxy (127.0.0.1:3900 -> any healthy Garage node). A db host (the
# all-in-one VM) talks to its own Garage, which listens on its private IP.
s3_endpoint: "http://{{ private_ip if inventory_hostname in groups['db'] else '127.0.0.1' }}:{{ s3_port }}"

# ---- API (role api, app nodes) -------------------------------------------------------------------
# Public name of the dashboard/API and the softphone's WebSocket (wss://<web_domain>/ws), served by
# the edge HAProxies. Same name as the SIP domain unless the team gets a separate one.
web_domain: "{{ sip_domain }}"
# The website's static build (role web: nginx on the app nodes, private IP). edge_haproxy sends
# page loads and /assets/ there; the API stays on api_port (3000).
web_port: 8081

# ---- TLS certificate (Let's Encrypt, role edge_haproxy) ----------------------------------------
# One publicly trusted certificate for web_domain (+ sip_domain if different) serves HTTPS/WSS
# (HAProxy) and SIP over TLS (Kamailio 5061) on every edge. Issued with HTTP-01 on ONE edge (the
# one the A record points to; DNS-01 is impossible, no DNS API) and copied to the others by Ansible.
# Needs inbound TCP 80 on that edge (nftables does it; the Clanode cloud firewall rule is manual).
# Runbook: docs/cloud-deploy.md §2. false = keep the self-signed certificates.
acme_enabled: true
# The edge that requests and renews the certificate: must be the one the Group tab's A record
# points to. If DNS moves to another edge, change this and rerun the edge play (cloud-deploy §2).
acme_edge: "{{ groups['edge'][0] }}"
# Names on the certificate.
acme_domains: "{{ [web_domain, sip_domain] | unique }}"
# Contact for Let's Encrypt expiry/problem mails; empty = register without an email.
# Kept in the encrypted vault (vault_acme_email): the repo is public. Optional.
acme_email: "{{ vault_acme_email | default('') }}"
# true = Let's Encrypt STAGING (untrusted certificates, generous rate limits): use it to test the
# flow, then set false and rerun (the role replaces a staging certificate automatically).
acme_staging: false
# Local port certbot's standalone HTTP-01 server listens on (127.0.0.1); HAProxy :80 forwards
# /.well-known/acme-challenge/ to it.
acme_http_port: 8888
# Course payment gateway (Stripe clone). Both URLs as on the Course Services tab (checked
# 2026-11-11, docs/verify-backlog.md V-S1).
stripe_api_url: "https://stripe.cse356.compas.cs.stonybrook.edu"
stripe_js_url: "https://stripe.cse356.compas.cs.stonybrook.edu/v3/"
# DID provider (DIDWW API v3 clone): base URL from the Course Services tab, e.g. https://<host>/v3.
# Required on app nodes (the api role refuses to deploy without it).
did_provider_url: "https://didww.cse356.compas.cs.stonybrook.edu/v3"
# DIDWW inbound trunk group (both edges, A7) that bought numbers are assigned to; or a single trunk
# in did_trunk_id. Exactly one must be set.
did_trunk_group_id: "4fba3ce0-568d-4a88-879b-d767f26eca4c"
did_trunk_id: ""

# ---- Test data (phase 1) -----------------------------------------------------------------------
load_test_seed: true
test_did: "+15555550100"

# Where the repo lives on the control machine (this file is infra/ansible/group_vars/all/main.yml).
repo_root: "{{ playbook_dir }}/../.."
