# Same as render-inventory.ini plus two media nodes (rtpengine sets 0 + 1 on the edges), so the
# media-node variant of kamailio.cfg is checked too. Original header:
# Test inventory for render-telephony.yml: 2 edges + 2 pbx on loopback addresses, so the rendered
# kamailio.cfg can be checked with `kamailio -c` on any Linux box.
# The two edges cover both layouts: edge-1 has its public IP on an interface; edge-2 is behind 1:1
# NAT like on Clanode (public_bind_ip = private_ip; binds 127.0.0.12, advertises 127.0.1.12).
[edge]
edge-1 private_ip=127.0.0.11 public_ip=127.0.1.11
edge-2 private_ip=127.0.0.12 public_ip=127.0.1.12 public_bind_ip=127.0.0.12 carrier_cidrs="['130.245.136.142/32', '192.168.56.1:5062']"

[pbx]
pbx-1 private_ip=127.0.0.21
pbx-2 private_ip=127.0.0.22

[db]
db-1 private_ip=127.0.0.41

[app]
# One app node so the rendered edge HAProxy has servers in `backend api` and `backend web`.
app-1 private_ip=127.0.0.31

[media]
# Two set generations (rtp_sets, kamailio.cfg.j2): set 1 = media-1 + media-2 (unset = 1), set 2 =
# all three, as after adding media-3 to a live system.
media-1 private_ip=127.0.0.51 public_ip=127.0.1.51 rtp_sets=1,2
media-2 private_ip=127.0.0.52 public_ip=127.0.1.52 public_bind_ip=127.0.0.52 rtp_sets="1,2"
media-3 private_ip=127.0.0.53 public_ip=127.0.1.53 rtp_sets=2

[mon]

[db_clients:children]
edge
pbx
