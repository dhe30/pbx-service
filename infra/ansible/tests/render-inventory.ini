# Test inventory for render-telephony.yml: 2 edges + 2 pbx on loopback addresses, so the rendered
# kamailio.cfg can be checked with `kamailio -c` on any Linux box.
# The two edges cover both layouts: edge-1 has its public IP on an interface; edge-2 is behind 1:1
# NAT like on Clanode (public_bind_ip = private_ip; binds 127.0.0.12, advertises 127.0.1.12).
[edge]
edge-1 private_ip=127.0.0.11 public_ip=127.0.1.11
edge-2 private_ip=127.0.0.12 public_ip=127.0.1.12 public_bind_ip=127.0.0.12 carrier_cidrs="['130.245.136.142/32', '192.168.56.1:5062']"

[pbx]
pbx-1 private_ip=127.0.0.21
pbx-2 private_ip=127.0.0.22

[db]
db-1 private_ip=127.0.0.41

[app]
[mon]

[db_clients:children]
edge
pbx
