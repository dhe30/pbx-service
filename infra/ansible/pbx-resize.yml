# Resize pbx nodes (more vCPUs), or apply a new maxcalls, one node at a time without dropping calls.
# The resize itself is a click in the Clanode UI (it reboots the VM); this playbook does everything
# around it:
#   0. skip the resize on a node that already has >= resize_vcpus vCPUs (re-runs resume)
#   1. guards (tasks/pbx-drain.yml): refuse during the peak (11-23 UTC) unless
#      -e resize_allow_peak=true, refuse if no OTHER pbx node is in service on some edge, refuse if
#      the other nodes are already > 70 % full
#   2. drain: dispatcher state d on every edge, wait for 0 calls (up to pbx_drain_wait_min, 45)
#   3. PAUSE: you resize the VM in Clanode, wait until it shows Running, press Enter
#   4. wait for SSH, check vCPUs and that the private IP is unchanged
#   5. asterisk.conf maxcalls = vCPUs x asterisk_calls_per_vcpu (group_vars, 80), restart Asterisk +
#      call app, wait for /health
#   6. dispatcher state a on every edge
# maxcalls only (no resize): -e maxcalls_apply=true drains every node whose asterisk.conf would
# change (steps 1-2), then 5-6. Asterisk reads maxcalls only at startup, so a restart is needed.
# A failure after the drain but before anything changed puts the node back; after the resize (or
# a failed restart) the node is left DRAINED (state d) for a human.
# Runbook (when, order, rollback): README §2.4 "Resizing pbx nodes".
#
#   ansible-playbook pbx-resize.yml --ask-vault-pass --limit pbx-1 -e resize_vcpus=8
#   ansible-playbook pbx-resize.yml --ask-vault-pass --limit pbx-1:pbx-2:pbx-3 -e resize_vcpus=8
#   ansible-playbook pbx-resize.yml --ask-vault-pass -e maxcalls_apply=true     # new asterisk_calls_per_vcpu
#
# resize_vcpus: the vCPU count of the target plan (Clanode 16G = 8; read it
# off the resize page). Run it on mon-1 (memory: SSH from the laptop to our public IPs is lossy).
- name: Resize pbx nodes / apply maxcalls (drain -> [Clanode resize] -> maxcalls -> back in service)
  hosts: pbx
  become: true
  serial: 1
  gather_facts: true
  vars:
    pbx_ds_uri: "sip:{{ private_ip }}:{{ asterisk_sip_port | default(5060) }}"
    resize_peak_utc: [11, 23]          # [first, last] UTC hour of the grader's business-hours peak
    resize_max_others_full: 0.70       # refuse if the other nodes are fuller than this (calls / maxcalls)
    rs_apply: "{{ maxcalls_apply | default(false) | bool }}"
  tasks:
    - name: resize_vcpus or maxcalls_apply is required
      ansible.builtin.assert:
        that: (resize_vcpus is defined and (resize_vcpus | int) > 0) or (rs_apply | bool)
        fail_msg: >-
          Pass -e resize_vcpus=<vCPUs of the target plan> (Clanode 16G = 8), or -e maxcalls_apply=true
          to apply a new maxcalls without resizing.
      run_once: true

    - name: Resize needed?
      ansible.builtin.set_fact:
        resize_needed: "{{ (resize_vcpus | default(0) | int) > 0 and (ansible_processor_vcpus | int) < (resize_vcpus | int) }}"

    - name: Nothing to resize
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} has {{ ansible_processor_vcpus }} vCPUs, no resize; only maxcalls is checked."
      when: not (resize_needed | bool)

    - name: Resize one node
      when: resize_needed | bool
      block:
        # ---- 1-2. guards + drain ----------------------------------------------------------------
        - name: Guards and drain
          ansible.builtin.include_tasks: tasks/pbx-drain.yml

        # ---- 3. the resize (by hand) -------------------------------------------------------------
        - name: Resize in Clanode
          ansible.builtin.pause:
            prompt: |

              {{ inventory_hostname }} ({{ private_ip }}) is drained and has 0 calls.
              Now, in Clanode (https://clanode.compas.cs.stonybrook.edu/linodes):
                {{ inventory_hostname }} -> Resize -> the plan with {{ resize_vcpus }} vCPUs -> Resize.
              Wait until it shows Running again, then press Enter here.
              (Ctrl+C then A aborts; the node stays drained, see README 2.4 for putting it back.)

        - name: Resized (from here a failure leaves the node drained)
          ansible.builtin.set_fact:
            rs_resized: true

        # ---- 4. back up, right size, same address --------------------------------------------------
        - name: Wait for SSH after the resize reboot
          ansible.builtin.wait_for_connection:
            delay: 5
            timeout: 1800

        - name: Re-read the hardware
          ansible.builtin.setup:
            gather_subset: [hardware, network]

        - name: Check vCPUs and address
          ansible.builtin.assert:
            that:
              - (ansible_processor_vcpus | int) >= (resize_vcpus | int)
              - ansible_default_ipv4.address == private_ip
            fail_msg: >-
              After the resize {{ inventory_hostname }} has {{ ansible_processor_vcpus }} vCPUs and address
              {{ ansible_default_ipv4.address }} (expected >= {{ resize_vcpus }} and {{ private_ip }}).
              It stays drained.

      rescue:
        # Drained but not resized yet (drain timed out, or aborted at the pause): the node runs as
        # before, so it can take calls again. After the resize: leave it drained for a human.
        - name: Put the node back (nothing was resized)
          ansible.builtin.include_tasks: tasks/pbx-drain-undo.yml
          when:
            - rs_drained | default(false) | bool
            - not (rs_resized | default(false) | bool)

        - name: Stop
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: stopped at "{{ ansible_failed_task.name }}".
              {% if not (rs_drained | default(false) | bool) %}Nothing was changed.
              {% elif not (rs_resized | default(false) | bool) %}It is back in service; nothing was resized.
              {% else %}It was resized and is LEFT DRAINED (dispatcher state d). Fix it, then re-run this playbook
              for it: it sees the new size, sets maxcalls, restarts and puts it back.{% endif %}

    # A node an earlier run resized but left drained (state d on every edge, 0 calls): finish it.
    - name: Left drained by an earlier run?
      when: not (resize_needed | bool)
      block:
        - name: Dispatcher flags for this node, per edge
          ansible.builtin.shell: |
            set -o pipefail
            kamcmd dispatcher.list | grep -E 'URI|FLAGS' | paste - - | grep -F '{{ pbx_ds_uri }}' | grep -o 'FLAGS: [A-Z]*' || true
          args:
            executable: /bin/bash
          delegate_to: "{{ item }}"
          loop: "{{ groups['edge'] }}"
          register: rs_flags
          changed_when: false

        - name: Calls on this node
          ansible.builtin.command: asterisk -rx 'core show channels count'
          register: rs_now
          changed_when: false

        - name: Treat it as drained
          ansible.builtin.set_fact:
            rs_drained: true
          when:
            - rs_flags.results | map(attribute='stdout') | select('match', 'FLAGS: D') | list | length == (groups['edge'] | length)
            - (((rs_now.stdout | regex_search('[0-9]+(?= active call| of [0-9]+ max active call)')) or '1') | int) == 0

    # ---- 5. maxcalls for the vCPUs it has now (also on a re-run of an already-resized node) ----------
    # vCPUs x asterisk_calls_per_vcpu (group_vars), like roles/asterisk/defaults; an inventory host var
    # asterisk_maxcalls still wins.
    - name: maxcalls for this size
      ansible.builtin.set_fact:
        rs_per_vcpu: "{{ asterisk_calls_per_vcpu | default(80) | int }}"
        rs_maxcalls: "{{ hostvars[inventory_hostname]['asterisk_maxcalls'] | default((ansible_processor_vcpus | int) * (asterisk_calls_per_vcpu | default(80) | int), true) }}"

    - name: Override in the inventory?
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} uses maxcalls {{ rs_maxcalls }}; {{ ansible_processor_vcpus }} vCPUs x {{ rs_per_vcpu }} would be
          {{ (ansible_processor_vcpus | int) * (rs_per_vcpu | int) }}. Remove asterisk_maxcalls from its inventory line if that is stale.
      when: (rs_maxcalls | int) != (ansible_processor_vcpus | int) * (rs_per_vcpu | int)

    - name: Would asterisk.conf change? (check mode)
      ansible.builtin.template:
        src: "{{ repo_root }}/telephony/asterisk/asterisk.conf.j2"
        dest: /etc/asterisk/asterisk.conf
        owner: asterisk
        group: asterisk
        mode: "0640"
      vars:
        asterisk_maxcalls: "{{ rs_maxcalls }}"
      check_mode: true
      diff: true
      register: rs_conf_check

    # maxcalls only: drain the node first (same guards as a resize).
    - name: Drain for the new maxcalls
      when:
        - rs_conf_check.changed
        - not (rs_drained | default(false) | bool)
        - rs_apply | bool
      block:
        - name: Guards and drain
          ansible.builtin.include_tasks: tasks/pbx-drain.yml
      rescue:
        - name: Put the node back (asterisk.conf not changed yet)
          ansible.builtin.include_tasks: tasks/pbx-drain-undo.yml
          when: rs_drained | default(false) | bool

        - name: Stop
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: stopped at "{{ ansible_failed_task.name }}".
              {% if rs_drained | default(false) | bool %}It is back in service with the old maxcalls.{% else %}Nothing was changed.{% endif %}

    # A changed asterisk.conf needs a restart. Only safe while the node has no calls: true after a
    # resize (drained, rebooted) or a maxcalls_apply drain.
    - name: Restart needed on a node in service?
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: asterisk.conf would change (maxcalls {{ rs_maxcalls }}) but the node is not drained.
          Re-run with -e maxcalls_apply=true (drains it, restarts, puts it back).
      when: rs_conf_check.changed and not (rs_drained | default(false) | bool)

    - name: asterisk.conf (maxcalls)
      ansible.builtin.template:
        src: "{{ repo_root }}/telephony/asterisk/asterisk.conf.j2"
        dest: /etc/asterisk/asterisk.conf
        owner: asterisk
        group: asterisk
        mode: "0640"
      vars:
        asterisk_maxcalls: "{{ rs_maxcalls }}"
      register: rs_conf

    - name: Restart Asterisk and the call app (node is drained)
      when: rs_drained | default(false) | bool
      block:
        - name: Restart Asterisk
          ansible.builtin.systemd:
            name: asterisk
            state: restarted
            daemon_reload: true

        - name: Restart the call app
          ansible.builtin.systemd:
            name: pbx-ari-app
            state: restarted

        - name: Wait until the call app is healthy (ARI connected + DB reachable)
          ansible.builtin.uri:
            url: http://127.0.0.1:9101/health
          register: rs_health
          retries: 45
          delay: 2
          until: rs_health.status == 200

        - name: Asterisk reports the new limit
          ansible.builtin.command: asterisk -rx 'core show channels count'
          register: rs_after
          changed_when: false
          failed_when: ("of " ~ rs_maxcalls ~ " max active call") not in rs_after.stdout

        # ---- 6. back in service ---------------------------------------------------------------------
        - name: "Put {{ inventory_hostname }} back on every edge (dispatcher state a)"
          ansible.builtin.command: kamcmd dispatcher.set_state a 1 {{ pbx_ds_uri }}
          delegate_to: "{{ item }}"
          loop: "{{ groups['edge'] }}"
          changed_when: true

        - name: Done
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: {{ ansible_processor_vcpus }} vCPUs, {{ rs_after.stdout_lines | last }}, back in service."
