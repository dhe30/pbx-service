# Update ONLY the edges' dispatcher list (pbx nodes, rendered from inventory group `pbx`) and
# reload it live with `kamcmd dispatcher.reload`. Kamailio keeps running: registrations, TLS/WS
# connections and calls in progress are untouched. Use it to add or remove pbx nodes when a full
# `--limit edge` run (which restarts Kamailio if kamailio.cfg changed) is not acceptable, e.g.
# during the peak or while an edge holds the grader's TLS phones (they do not reconnect).
#   ansible-playbook dispatcher.yml --ask-vault-pass            # both edges
#   ansible-playbook dispatcher.yml --ask-vault-pass --check --diff
# What stays stale until the next full edge deploy: kamailio.cfg's `private_hops` (faster 100 ms
# retransmits toward pbx nodes, and the socket of stateless replies to them). Calls to the new
# nodes work without it; "is this request from Asterisk" uses the dispatcher list (ds_is_from_list),
# which this reload updates.
- name: Dispatcher list only (no Kamailio restart)
  hosts: edge
  become: true
  serial: 1
  tasks:
    - name: Dispatcher list (pbx nodes)
      ansible.builtin.template:
        src: "{{ repo_root }}/telephony/kamailio/dispatcher.list.j2"
        dest: /etc/kamailio/dispatcher.list
        owner: root
        group: kamailio
        mode: "0640"
      register: ds_list

    - name: Reload dispatcher
      ansible.builtin.command: kamcmd dispatcher.reload
      when: ds_list.changed and not ansible_check_mode

    - name: Show the dispatcher set
      ansible.builtin.shell: kamcmd dispatcher.list | grep -E 'URI|FLAGS'
      register: ds_now
      changed_when: false
      when: not ansible_check_mode

    - name: Dispatcher now
      ansible.builtin.debug:
        var: ds_now.stdout_lines
      when: not ansible_check_mode
