---
# Restart Asterisk / the call app on ONE pbx node without dropping calls (site.yml, pbx play,
# serial: 1). The roles only record what needs a restart (pbx_pending_restarts, handlers with
# pbx_defer_restarts); config changes Asterisk can reload were already applied live.
#
# Pending = recorded in this run, or left in /var/lib/pbx-restart-pending by a run that stopped
# before the restart finished (a re-run sees nothing "changed" but still restarts). Cleared only
# after a healthy restart.
# Nothing pending -> nothing happens (no drain). Otherwise:
#   0. refuse if no OTHER pbx node is in service on some edge (draining would leave none).
#   1. dispatcher state d (disabled) for this node on every edge: no new calls. `d`, not `i`:
#      the edges' OPTIONS pings switch an inactive node back on (ds_probing_mode=1).
#   2. wait until Asterisk has 0 active calls, up to pbx_drain_wait_min (calls last up to ~35 min).
#   3. restart what is pending, wait for the call app's /health.
#   4. dispatcher state a on every edge.
# On a drain timeout the node is put back (state a) and the play stops, unless
# -e pbx_drain_on_timeout=deploy (restart anyway: the remaining calls are dropped).
# -e pbx_drain=false skips 1-2 (emergency: restart now, calls dropped).

# The handlers also write what is pending to a file on the node, so a run that was stopped (Ctrl+C,
# drain timeout, failed restart) leaves it behind and the next run restarts even though nothing
# "changed" any more. Cleared only after a successful restart.
- name: Restarts recorded on the node by an earlier, unfinished run
  ansible.builtin.command: cat {{ pbx_restart_marker | default('/var/lib/pbx-restart-pending') }}
  register: pbx_marker
  changed_when: false
  failed_when: false

- name: Restarts pending on this node
  ansible.builtin.set_fact:
    pbx_restarts: >-
      {{ ((pbx_pending_restarts | default([])) + (pbx_marker.stdout_lines | default([])))
         | map('trim') | select | unique | list }}

- name: Nothing to restart (configs were reloaded live, or nothing changed)
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: no restart needed, node stays in service"
  when: pbx_restarts | length == 0

- name: Drain, restart, put back
  when: pbx_restarts | length > 0
  vars:
    pbx_ds_uri: "sip:{{ private_ip }}:{{ asterisk_sip_port | default(5060) }}"
    pbx_drain_enabled: "{{ pbx_drain | default(true) | bool }}"
  block:
    # A node added to the inventory isn't in the edges' dispatcher list until the next edge deploy:
    # no call can reach it, and kamcmd dispatcher.set_state would fail for it. Then skip the guard,
    # the drain and the put-back (the edge deploy adds it as active).
    - name: Is this node in the dispatcher list of every edge?
      ansible.builtin.shell: |
        kamcmd dispatcher.list | grep -cF 'URI: {{ pbx_ds_uri }}' || true
      delegate_to: "{{ item }}"
      loop: "{{ groups['edge'] }}"
      register: pbx_known
      changed_when: false

    - name: Drain only a node the edges route calls to
      ansible.builtin.set_fact:
        pbx_ds_known: "{{ (pbx_known.results | map(attribute='stdout') | map('int') | select('gt', 0) | list | length) == (groups['edge'] | length) }}"

    - name: Drain this run?
      ansible.builtin.set_fact:
        pbx_drain_active: "{{ pbx_drain_enabled | bool and pbx_ds_known | bool }}"

    - name: New node (not in the edges' dispatcher list yet)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} isn't in the edges' dispatcher list: no calls can reach it, restarting without a drain. The next `--limit edge` deploy adds it."
      when: not (pbx_ds_known | bool)

    # Never take the last node out of service: with every pbx node disabled, Kamailio answers new
    # calls "no pbx node available". Counts the OTHER set-1 destinations whose flags start with A.
    - name: Other pbx nodes in service, per edge
      ansible.builtin.shell: |
        set -o pipefail
        kamcmd dispatcher.list | grep -E 'URI|FLAGS' | paste - - | grep -v '{{ pbx_ds_uri }}' | grep -c 'FLAGS: A' || true
      args:
        executable: /bin/bash
      delegate_to: "{{ item }}"
      loop: "{{ groups['edge'] }}"
      register: pbx_others
      changed_when: false
      when: pbx_drain_active | bool

    - name: Refuse to drain the last pbx node in service
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is the only pbx node in service on
          {{ pbx_others.results | selectattr('stdout', 'defined') | selectattr('stdout', 'equalto', '0') | map(attribute='item') | join(', ') }}.
          Draining it would leave no pbx node. Put the other node back first
          (kamcmd dispatcher.set_state a 1 sip:<its ip>:5060 on every edge), then re-run.
      when:
        - pbx_drain_active | bool
        - pbx_others.results | selectattr('stdout', 'defined') | selectattr('stdout', 'equalto', '0') | list | length > 0

    - name: "Drain {{ inventory_hostname }} on every edge (dispatcher state d)"
      ansible.builtin.command: kamcmd dispatcher.set_state d 1 {{ pbx_ds_uri }}
      delegate_to: "{{ item }}"
      loop: "{{ groups['edge'] }}"
      changed_when: true
      when: pbx_drain_active | bool

    - name: Calls on this node when the drain started
      ansible.builtin.shell: |
        asterisk -rx 'core show channels count' | grep 'active call'
        asterisk -rx 'core show channels concise' | awk -F'!' '$12 > max {max = $12} END {printf "longest call so far: %d min\n", max / 60}'
      register: pbx_drain_start
      changed_when: false
      when: pbx_drain_active | bool

    - name: "Waiting for 0 calls (up to {{ pbx_drain_wait_min | default(45) }} min; started with: {{ pbx_drain_start.stdout_lines | default([]) | join(', ') }})"
      ansible.builtin.command: asterisk -rx 'core show channels count'
      register: pbx_calls
      # "N active calls", or "N of M max active calls" once asterisk.conf sets maxcalls -> N
      # (no capture group: Jinja turns '\1' into a control character).
      until: (((pbx_calls.stdout | regex_search('[0-9]+(?= active call| of [0-9]+ max active call)')) or '1') | int) == 0
      retries: "{{ ((pbx_drain_wait_min | default(45) | int) * 60 / 15) | int }}"
      delay: 15
      changed_when: false
      failed_when: false
      when: pbx_drain_active | bool

    - name: Drain timed out
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} still has calls after {{ pbx_drain_wait_min | default(45) }} min
          ({{ pbx_calls.stdout_lines | default([]) | join(', ') }}). Putting it back in service, nothing restarted.
          Re-run later, or with -e pbx_drain_on_timeout=deploy to restart anyway (drops those calls).
      when:
        - pbx_drain_active | bool
        - (((pbx_calls.stdout | default('') | regex_search('[0-9]+(?= active call| of [0-9]+ max active call)')) or '1') | int) > 0
        - (pbx_drain_on_timeout | default('abort')) != 'deploy'

    - name: Mark the restart as started (from here a failure leaves the node drained)
      ansible.builtin.set_fact:
        pbx_rollout_restarting: true

    - name: Restart Asterisk
      ansible.builtin.systemd:
        name: asterisk
        state: restarted
        daemon_reload: true
      when: "'asterisk' in pbx_restarts"

    # After an Asterisk restart the call app loses its ARI WebSocket and exits anyway; restarting
    # it here as well keeps the order deterministic.
    - name: Restart the call app
      ansible.builtin.systemd:
        name: pbx-ari-app
        state: restarted
        daemon_reload: true

    - name: Wait until the call app is healthy (ARI connected + DB reachable)
      ansible.builtin.uri:
        url: http://127.0.0.1:9101/health
      register: pbx_health
      retries: 45
      delay: 2
      until: pbx_health.status == 200

    - name: Clear the restarts recorded on the node
      ansible.builtin.file:
        path: "{{ pbx_restart_marker | default('/var/lib/pbx-restart-pending') }}"
        state: absent

    - name: "Put {{ inventory_hostname }} back on every edge (dispatcher state a)"
      ansible.builtin.command: kamcmd dispatcher.set_state a 1 {{ pbx_ds_uri }}
      delegate_to: "{{ item }}"
      loop: "{{ groups['edge'] }}"
      changed_when: true
      when: pbx_ds_known | bool

    - name: Restarts done
      ansible.builtin.set_fact:
        pbx_pending_restarts: []
        pbx_rollout_restarting: false

  rescue:
    # Failed before restarting (e.g. drain timeout): the node still runs the old processes, so it
    # can take calls again. Failed during/after the restart: leave it drained for a human.
    - name: Put the node back in service (nothing was restarted)
      ansible.builtin.command: kamcmd dispatcher.set_state a 1 {{ pbx_ds_uri }}
      delegate_to: "{{ item }}"
      loop: "{{ groups['edge'] }}"
      changed_when: true
      when:
        - not (pbx_rollout_restarting | default(false))
        - pbx_ds_known | default(false) | bool

    - name: Stop the rollout
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: rollout failed at "{{ ansible_failed_task.name }}".
          {% if not (pbx_rollout_restarting | default(false)) %}It is back in service; nothing was restarted.
          {% elif pbx_drain_active | default(false) | bool %}The node is LEFT DRAINED (dispatcher state d on every edge). Fix it,
          check `curl -s 127.0.0.1:9101/health`, then on both edges: kamcmd dispatcher.set_state a 1 {{ pbx_ds_uri }}
          {% else %}It was not drained (pbx_drain=false, or a node the edges don't route to yet); fix it and check `curl -s 127.0.0.1:9101/health`.{% endif %}
