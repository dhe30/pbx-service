# Put a drained pbx node back in service (included by pbx-resize.yml's rescues when nothing on the
# node was changed yet). First shows what is still up: when the drain timed out, the next run can
# wait longer (-e pbx_drain_wait_min=N) or hang the stuck call up
# (asterisk -rx 'channel request hangup <channel>'); on 2026-11-24 one 55-min call held pbx-1.
- name: Calls still up (channel, state, caller, seconds up)
  ansible.builtin.shell: |
    set -o pipefail
    asterisk -rx 'core show channels concise' | cut -d'!' -f1,5,8,12 | sort -t'!' -k4 -nr | head -20
  args:
    executable: /bin/bash
  register: rs_left
  changed_when: false
  failed_when: false

- name: Show them
  ansible.builtin.debug:
    var: rs_left.stdout_lines
  when: rs_left.stdout_lines | default([]) | length > 0

- name: Put the node back in service (dispatcher state a on every edge)
  ansible.builtin.command: kamcmd dispatcher.set_state a 1 {{ pbx_ds_uri }}
  delegate_to: "{{ item }}"
  loop: "{{ groups['edge'] }}"
  changed_when: true
