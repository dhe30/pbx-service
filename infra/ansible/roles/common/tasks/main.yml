---
# Baseline for every VM: packages, hostname, host firewall.

# Background package managers grab the apt/dpkg lock at random times (PackageKit on desktop
# installs, e.g. a VirtualBox unattended install; unattended-upgrades' apt timers on servers), and
# an apt task that runs into the lock fails the deploy ("Could not get lock
# /var/lib/dpkg/lock-frontend ... held by packagekitd"). These servers are only changed by Ansible:
# stop and mask them before any apt task. Stopping PackageKit mid-refresh is safe.
- name: Find installed services
  ansible.builtin.service_facts:

- name: Stop and mask background package managers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - packagekit.service
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service
    - unattended-upgrades.service
  when: item in ansible_facts.services or item.endswith('.timer')
  failed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - acl            # lets Ansible "become" unprivileged users (postgres, asterisk)
      - ca-certificates
      - chrony
      - curl
      - gnupg
      - jq
      - nftables
      - rsync
      - sngrep         # live SIP ladder diagrams: the #1 debugging tool for this project
      - tcpdump
      - unzip
    update_cache: true
    cache_valid_time: 3600

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# ---- Team SSH access -----------------------------------------------------------------------------
# One file per person in roles/common/files/team_keys/<name>.pub holding their PUBLIC key (safe to
# commit). Only lines that look like keys are used, so placeholder/comment lines are skipped.
# Run just this part:  ansible-playbook site.yml --tags ssh_keys
# team_keys_exclusive (defaults/main.yml): false = only ADD keys; true = also REMOVE every key on
# the VM that is not in the folder (revoking access = delete the file + rerun). Only switch it on
# once your own working key is in the folder, or you lock yourself out.
- name: Team SSH keys for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ team_ssh_keys | join('\n') }}"
    exclusive: "{{ team_keys_exclusive }}"
  vars:
    team_key_files: "{{ query('ansible.builtin.fileglob', role_path ~ '/files/team_keys/*.pub') }}"
    # Keep this double-quoted: inside a YAML >- block, '\n' does not split on newlines.
    team_ssh_keys: "{{ (query('ansible.builtin.file', *team_key_files) if team_key_files else [])
      | map('split', '\n') | flatten | map('trim') | select('match', '^(ssh-|ecdsa-|sk-)') | list }}"
  when: team_ssh_keys | length > 0
  tags: [ssh_keys]

- name: Host firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable host firewall
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started

- name: Config directory for pbx services
  ansible.builtin.file:
    path: /etc/pbx
    state: directory
    mode: "0755"

# ---- node_exporter (Track 4) ---------------------------------------------------------------------
# Reports this VM's CPU, memory, disk, network, boot time and systemd unit states to Prometheus on
# mon-1 (roles/monitoring). Debian's package; no recommends (they pull extra textfile collectors).
- name: Install node_exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    install_recommends: false

- name: node_exporter settings (private IP only, systemd collector)
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
  notify: Restart node_exporter

- name: Start node_exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: started
