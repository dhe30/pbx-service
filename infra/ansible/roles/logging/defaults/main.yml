---
# Logs on every VM (Track 4): keep the logs needed after a crash, and make sure no log can fill a
# disk and take a node down.
#
# Where logs go: almost every service (Kamailio, HAProxy, rtpengine, Patroni, etcd, Garage, the API,
# the ARI app, Prometheus) logs to the systemd journal. Plain files: Asterisk (/var/log/asterisk),
# pgBackRest (/var/log/pgbackrest), Postgres (weekday files in its data dir, already bounded),
# Grafana (rotates itself), and /var/log/syslog etc. if rsyslog is installed.

# ---- journald ----
# Where the journal lives. "persistent" = /var/log/journal on disk (survives reboots).
# "volatile" = /run/log/journal in RAM only: lost on reboot, but journald never waits for the disk.
#
# Why the call path is volatile (2026-11-25, docs/incidents/2026-11-25-disk-stalls-call-path.md):
# the platform's storage froze for 1-2 min at a time on random VMs. journald blocks on a frozen
# disk, stops reading its sockets, and then every process that logs blocks in syslog()/stdout:
# media-4's rtpengine (~600 lines/s) stopped answering Kamailio for 97 s ("no available proxies",
# lost calls) and edge-2's journal stalled 50 s ("no pbx node", REGISTER failures) while the VMs
# themselves kept running. Edges and media nodes therefore keep their journal in RAM; SIP history
# stays on disk in sipdump's pcaps (written by its own process, not by the SIP workers).
# db nodes too (2026-11-25 18:2x UTC): Patroni (~3,400 traceback lines/min from health-check
# connection resets) and Garage (~740/min) put ~0.3 MB/s of journal writes + syncs on the root disk
# that Postgres WAL and etcd fsync on.
journald_volatile_groups: [edge, media, db]
journald_storage: "{{ 'volatile' if (group_names | intersect(journald_volatile_groups)) else 'persistent' }}"
# RAM for the volatile journal. /run is a tmpfs of 10 % of RAM (edges: 198M of 2 GB, media-2: 1.6G,
# db: 393M of 4 GB), and other services keep their sockets and pid files there, so stay well below.
journald_runtime_max_use: "{{ '800M' if 'media' in group_names else ('150M' if 'db' in group_names else '100M') }}"
# Total journal size on disk. Debian's default is 10% of the filesystem (max 4 GiB); a fixed cap
# is easier to reason about on small VMs.
journald_max_use: 1G
# Never fill the disk beyond this much free space, whatever max_use says.
journald_keep_free: 2G
# Drop entries older than this even if there is room.
journald_max_retention: 14day
# Per-service rate limit: more than burst lines in interval and journald DROPS the rest (it logs
# "Suppressed N messages"). The default (10000 / 30 s) can be hit by Kamailio or HAProxy under
# load, which would lose exactly the logs needed to debug it.
journald_rate_limit_interval: 30s
journald_rate_limit_burst: 50000

# ---- logrotate (plain log files) ----
# Rotate any logrotate-managed file once it passes this size, checked every hour, in addition to
# its own daily/weekly schedule. Applies to every file in /etc/logrotate.d that doesn't set its own
# size limit (e.g. /var/log/syslog from rsyslog).
logrotate_max_size: 200M
