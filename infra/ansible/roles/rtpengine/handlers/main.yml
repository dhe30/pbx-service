---
# NOTE: restarting rtpengine drops audio of calls in progress on this node.
- name: Restart rtpengine
  ansible.builtin.systemd:
    name: "{{ rtpengine_service }}"
    state: restarted
    daemon_reload: true

- name: Restart pbx-call-audio
  ansible.builtin.systemd:
    name: pbx-call-audio
    state: restarted
    daemon_reload: true
