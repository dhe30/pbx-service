---
# systemd unit shipped by the rtpengine.dfx.at packages. Since the 2025 releases it is
# "rtpengine-daemon" (older packages: "ngcp-rtpengine-daemon").
rtpengine_service: rtpengine-daemon
# B3: relay non-transcoded media in the kernel (table = 0). false = userspace only (table = -1).
rtpengine_kernel_forwarding: true
# Media worker threads; default = vCPUs.
rtpengine_threads: "{{ ansible_processor_vcpus | default(2) }}"

# ---- pbx-call-audio: per-call audio verdicts from rtpengine's final stats (files/pbx-call-audio.py)
# Peers whose calls are our own tests, not customers (counted with test="true"): mon-1, whose
# synthetic call and codec quality test reach the edges from its public egress address
# (130.245.136.144, NAT) and announce its private address in their SDP.
call_audio_test_peers: "{{ ['130.245.136.144'] + (groups.get('mon', []) | map('extract', hostvars, 'private_ip') | list) }}"
call_audio_jsonl: /var/log/pbx/call-audio.jsonl
