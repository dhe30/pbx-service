---
# rtpengine media relay (edge nodes): anchors all audio, transcodes, does WebRTC. CLAUDE.md §8.
# Packages from rtpengine.dfx.at (built with ffmpeg transcoding + bcg729 for G.729).

- name: Download rtpengine repo keyring package
  ansible.builtin.get_url:
    url: https://rtpengine.dfx.at/latest/pool/main/r/rtpengine-dfx-repo-keyring/rtpengine-dfx-repo-keyring_1.0_all.deb
    dest: /var/cache/rtpengine-dfx-repo-keyring_1.0_all.deb
    checksum: sha256:78fe26f0251138f4e3c749c88dc4df29666c8efe0823858d3a4ab49d2fa2e088
    mode: "0644"

- name: Install rtpengine repo keyring
  ansible.builtin.apt:
    deb: /var/cache/rtpengine-dfx-repo-keyring_1.0_all.deb

- name: rtpengine apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/dfx.at-rtpengine.list
    content: "deb [signed-by=/usr/share/keyrings/dfx.at-rtpengine-archive-keyring.gpg] https://rtpengine.dfx.at/{{ rtpengine_release }} {{ ansible_distribution_release }} main\n"
    mode: "0644"

# Daemon + CLI, plus (B3) the in-kernel forwarding module built by DKMS for the running kernel.
# With the module, packets that need no transcoding (PCMU<->PCMU, SRTP<->RTP re-encryption) are
# relayed in the kernel instead of userspace. If the module can't load, rtpengine logs it and
# falls back to userspace forwarding (no --no-fallback), so a failed DKMS build never stops calls.
- name: Install rtpengine
  ansible.builtin.apt:
    name: "{{ ['rtpengine-daemon', 'rtpengine-utils'] + (['rtpengine-kernel-dkms', 'linux-headers-' ~ ansible_kernel] if rtpengine_kernel_forwarding else []) }}"
    install_recommends: false
    update_cache: true

- name: rtpengine config
  ansible.builtin.template:
    src: "{{ repo_root }}/telephony/rtpengine/rtpengine.conf.j2"
    dest: /etc/rtpengine/rtpengine.conf
    mode: "0644"
  notify: Restart rtpengine

- name: Systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/{{ rtpengine_service }}.service.d
    state: directory
    mode: "0755"

- name: Always restart rtpengine if it dies
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ rtpengine_service }}.service.d/restart.conf
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=2
    mode: "0644"
  notify: Restart rtpengine

# Media nodes: rtpengine's port range (20000-60000) covers most of Linux's default ephemeral range
# (32768-60999). A UDP port the kernel hands to an outgoing socket (DNS, NTP) is one rtpengine can't
# bind, so outgoing sockets get the ports above the media range instead. Takes effect for new
# sockets at once; no restart.
- name: Ephemeral ports above the media range (media nodes)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/92-rtpengine-ports.conf
    content: |
      # Managed by Ansible (role rtpengine). Media ports: {{ rtpengine_port_min }}-{{ rtpengine_port_max }}.
      net.ipv4.ip_local_port_range = {{ rtpengine_port_max | int + 1 }} 65535
    mode: "0644"
  register: rtpengine_port_sysctl
  when: inventory_hostname in groups.get('media', []) and rtpengine_port_max | int < 65000

- name: Apply the ephemeral port range now
  ansible.builtin.command: sysctl -q -p /etc/sysctl.d/92-rtpengine-ports.conf
  when: rtpengine_port_sysctl is changed
  changed_when: true

- name: Start rtpengine
  ansible.builtin.systemd:
    name: "{{ rtpengine_service }}"
    enabled: true
    state: started
    daemon_reload: true

# ---- Per-call audio record (docs/incidents/2026-11-14-codec-flip.md) ---------------------------
# pbx-call-audio follows rtpengine's journal and turns each call's "Final packet stats" (log-level 6)
# into one JSON line in {{ call_audio_jsonl }} plus verdict counters for node_exporter. Read-only:
# it never talks to rtpengine, so restarting it never touches calls.
- name: pbx-call-audio script
  ansible.builtin.copy:
    src: pbx-call-audio.py
    dest: /usr/local/bin/pbx-call-audio
    mode: "0755"
  notify: Restart pbx-call-audio

- name: Directories for the call audio record and its metrics
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ call_audio_jsonl | dirname }}"
    - /var/lib/prometheus/node-exporter

- name: pbx-call-audio service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pbx-call-audio.service
    content: |
      [Unit]
      Description=Per-call audio verdicts from rtpengine final stats
      After={{ rtpengine_service }}.service

      [Service]
      ExecStart=/usr/local/bin/pbx-call-audio --follow --unit {{ rtpengine_service }} --jsonl {{ call_audio_jsonl }} --prom /var/lib/prometheus/node-exporter/pbx_call_audio.prom{% for ip in call_audio_test_peers %} --test-peer {{ ip }}{% endfor %}

      Restart=always
      RestartSec=5
      Nice=10

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart pbx-call-audio

- name: Rotate the call audio record (14 days)
  ansible.builtin.copy:
    dest: /etc/logrotate.d/pbx-call-audio
    content: |
      {{ call_audio_jsonl }} {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    mode: "0644"

- name: Start pbx-call-audio
  ansible.builtin.systemd:
    name: pbx-call-audio
    enabled: true
    state: started
    daemon_reload: true
