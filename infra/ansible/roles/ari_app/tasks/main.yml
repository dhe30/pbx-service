---
# ARI call-control app (services/ari-app), one per pbx node, running as the `asterisk` user so it
# can read Asterisk's recordings and write the greeting cache. Built on the host from the repo.

- name: NodeSource apt key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    mode: "0644"

- name: NodeSource apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: "deb [signed-by=/usr/share/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main\n"
    mode: "0644"

- name: Install Node.js {{ node_major }}
  ansible.builtin.apt:
    name: nodejs
    update_cache: true

- name: Source directory
  ansible.builtin.file:
    path: /opt/pbx/src
    state: directory
    mode: "0755"

# Whole repo minus heavy/irrelevant dirs (npm workspaces need every package.json to be present).
- name: Sync source
  ansible.posix.synchronize:
    src: "{{ repo_root }}/"
    dest: /opt/pbx/src/
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=dist"
      - "--exclude=infra"
      - "--exclude=loadtest"
      - "--exclude=dev"
  register: ari_src

- name: Check for a previous build
  ansible.builtin.stat:
    path: /opt/pbx/src/services/ari-app/dist/index.js
  register: ari_dist

- name: Install dependencies and build
  ansible.builtin.shell: |
    set -e
    npm ci --no-audit --no-fund -w @pbx/shared -w @pbx/ari-app
    npm run build -w @pbx/shared -w @pbx/ari-app
  args:
    chdir: /opt/pbx/src
    executable: /bin/bash
  when: ari_src.changed or not ari_dist.stat.exists
  notify: Restart ari-app

- name: Environment file (contains secrets)
  ansible.builtin.template:
    src: ari-app.env.j2
    dest: /etc/pbx/ari-app.env
    owner: root
    group: asterisk
    mode: "0640"
  notify: Restart ari-app

- name: systemd unit
  ansible.builtin.template:
    src: pbx-ari-app.service.j2
    dest: /etc/systemd/system/pbx-ari-app.service
    mode: "0644"
  notify: Restart ari-app

- name: Start ARI app
  ansible.builtin.systemd:
    name: pbx-ari-app
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait until the ARI app is healthy (ARI connected + DB reachable)
  ansible.builtin.uri:
    url: http://127.0.0.1:9101/health
  register: ari_health
  retries: 30
  delay: 2
  until: ari_health.status == 200
