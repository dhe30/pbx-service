---
asterisk_sip_port: 5060
# asterisk.conf maxload: refuse new calls above this 1-minute load average (see the template).
asterisk_maxload: "{{ (ansible_processor_vcpus | default(1) | int) * 2 }}"
asterisk_src_dir: "/usr/src/asterisk-{{ asterisk_version }}"
asterisk_build_log: /usr/src/asterisk-build.log
asterisk_config_files:
  - asterisk.conf
  - modules.conf
  - logger.conf
  - pjsip.conf
  - extensions.conf
  - ari.conf
  - http.conf
  - rtp.conf
  - prometheus.conf
  - musiconhold.conf
  - indications.conf  # ringback/busy tones; ring.ts plays tone:ring;tonezone=us
