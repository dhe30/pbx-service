---
# Restarting Asterisk drops the node's calls. With pbx_defer_restarts (site.yml) the restart is
# only recorded here and done by tasks/pbx-rollout.yml after draining the node.
- name: Restart asterisk now
  listen: Restart asterisk
  ansible.builtin.systemd:
    name: asterisk
    state: restarted
    daemon_reload: true
  when: not (pbx_defer_restarts | bool)

- name: Record that asterisk needs a restart
  listen: Restart asterisk
  ansible.builtin.set_fact:
    pbx_pending_restarts: "{{ (pbx_pending_restarts | default([])) + ['asterisk'] }}"
  when: pbx_defer_restarts | bool

# Also on the node: a re-run after an interrupted rollout sees nothing "changed" (code and
# configs are already in place) but must still restart. pbx-rollout.yml reads and clears it.
- name: Record on the node that asterisk needs a restart
  listen: Restart asterisk
  ansible.builtin.lineinfile:
    path: "{{ pbx_restart_marker | default('/var/lib/pbx-restart-pending') }}"
    line: asterisk
    create: true
    mode: "0644"
  when: pbx_defer_restarts | bool
