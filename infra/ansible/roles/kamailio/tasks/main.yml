---
# Kamailio SIP edge: registrar (staff), dispatcher (to Asterisk), rtpengine control. CLAUDE.md §7.

- name: Kamailio apt key
  ansible.builtin.get_url:
    url: https://deb.kamailio.org/kamailiodebkey.gpg
    dest: /usr/share/keyrings/kamailio.asc
    mode: "0644"

- name: Kamailio apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kamailio.list
    content: "deb [signed-by=/usr/share/keyrings/kamailio.asc] http://deb.kamailio.org/kamailio{{ kamailio_version }} {{ ansible_distribution_release }} main\n"
    mode: "0644"

- name: Install Kamailio
  ansible.builtin.apt:
    name:
      - kamailio
      - kamailio-postgres-modules
      - kamailio-websocket-modules
      - kamailio-extra-modules
      - kamailio-tls-modules
      - kamailio-utils-modules
    update_cache: true

- name: Dispatcher list (pbx nodes)
  ansible.builtin.template:
    src: "{{ repo_root }}/telephony/kamailio/dispatcher.list.j2"
    dest: /etc/kamailio/dispatcher.list
    owner: root
    group: kamailio
    mode: "0640"
  notify: Reload dispatcher

# TLS for phones using the _sips._tcp SRV record. Self-signed until the edge_haproxy role
# installs the Let's Encrypt certificate (same one as HTTPS) at these paths (pbx-install-cert).
- name: TLS directory
  ansible.builtin.file:
    path: /etc/kamailio/tls
    state: directory
    owner: root
    group: kamailio
    mode: "0750"

- name: Self-signed TLS certificate for {{ sip_domain }} (if none provided)
  ansible.builtin.command: >-
    openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj "/CN={{ sip_domain }}"
    -addext "subjectAltName=DNS:{{ sip_domain }}"
    -keyout {{ kamailio_tls_key }} -out {{ kamailio_tls_cert }}
  args:
    creates: "{{ kamailio_tls_cert }}"

- name: TLS key readable by Kamailio
  ansible.builtin.file:
    path: "{{ kamailio_tls_key }}"
    owner: root
    group: kamailio
    mode: "0640"

- name: Kamailio TLS config
  ansible.builtin.template:
    src: "{{ repo_root }}/telephony/kamailio/tls.cfg.j2"
    dest: /etc/kamailio/tls.cfg
    owner: root
    group: kamailio
    mode: "0640"
  notify: Restart kamailio

# SIP history (kamailio.cfg sipdump): every SIP message the edge receives or sends, TLS and WebSocket
# included (written after decryption), as hourly pcap files. Kamailio removes files older than
# kamailio_sipdump_keep_hours itself (fage, read at start); the hourly pbx-sipdump-prune timer
# enforces the same age plus a size cap (kamailio_sipdump_max_gb) without a restart; the tmpfiles
# rule creates the folder at boot and is the last backstop. Search: loadtest/diag/sip-history.py.
- name: SIP history folder
  ansible.builtin.file:
    path: "{{ kamailio_sipdump_dir }}"
    state: directory
    owner: kamailio
    group: kamailio
    mode: "0750"

- name: SIP history cleanup (systemd-tmpfiles)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/pbx-sipdump.conf
    content: |
      # Managed by Ansible (role kamailio): SIP history pcaps, see kamailio.cfg sipdump.
      d {{ kamailio_sipdump_dir }} 0750 kamailio kamailio {{ kamailio_sipdump_keep_hours + 12 }}h
    mode: "0644"

- name: SIP history prune script (age + size cap)
  ansible.builtin.template:
    src: pbx-sipdump-prune.sh.j2
    dest: /usr/local/sbin/pbx-sipdump-prune
    mode: "0755"

- name: SIP history prune service + hourly timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: pbx-sipdump-prune.service
      content: |
        # Managed by Ansible (role kamailio). Deletes old SIP history pcaps, see the script.
        [Unit]
        Description=Prune SIP history pcaps (sipdump)

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/pbx-sipdump-prune
        Nice=10
        IOSchedulingClass=idle
    - name: pbx-sipdump-prune.timer
      content: |
        # Managed by Ansible (role kamailio). sipdump rotates hourly; prune a few minutes later.
        [Unit]
        Description=Prune SIP history pcaps hourly

        [Timer]
        OnCalendar=*-*-* *:10:00
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: sipdump_prune_units

# Starting/enabling the timer never touches Kamailio.
- name: SIP history prune timer enabled
  ansible.builtin.systemd:
    name: pbx-sipdump-prune.timer
    enabled: true
    state: started
    daemon_reload: "{{ sipdump_prune_units.changed }}"

- name: Kamailio config (contains the DB password)
  ansible.builtin.template:
    src: "{{ repo_root }}/telephony/kamailio/kamailio.cfg.j2"
    dest: /etc/kamailio/kamailio.cfg
    owner: root
    group: kamailio
    mode: "0640"
    # Syntax + module/fixup check before replacing the live config.
    validate: kamailio -c -f %s
  notify: Restart kamailio

- name: Kamailio defaults (memory, config path)
  ansible.builtin.copy:
    dest: /etc/default/kamailio
    content: |
      # Managed by Ansible.
      RUN_KAMAILIO=yes
      CFGFILE=/etc/kamailio/kamailio.cfg
      SHM_MEMORY=512
      PKG_MEMORY=16
    mode: "0644"
  notify: Restart kamailio

- name: Systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/kamailio.service.d
    state: directory
    mode: "0755"

- name: Always restart Kamailio if it dies
  ansible.builtin.copy:
    dest: /etc/systemd/system/kamailio.service.d/restart.conf
    content: |
      [Unit]
      # Don't give up after a few fast failures (e.g. DB not up yet at boot).
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=2
    mode: "0644"
  notify: Restart kamailio

# Open files: Kamailio's TCP main process holds one fd per TCP/TLS/WS connection, so it needs at
# least tcp_max_connections of them. Debian's unit leaves the soft limit at 1024: on 2026-11-23
# edge-2 held ~974 TLS phones, hit it at 08:40 and refused every new TLS connection ("Too many
# open files", probe_sip_tls failing) until the limit was raised live with prlimit.
# The drop-in only applies at the next start, and a restart strands the grader's TLS phones, so
# this does NOT notify a restart: the next task raises the running processes' limit instead.
- name: Kamailio open-files limit
  ansible.builtin.copy:
    dest: /etc/systemd/system/kamailio.service.d/limits.conf
    content: |
      # Managed by Ansible (role kamailio): >= tcp_max_connections + room; see tasks/main.yml.
      [Service]
      LimitNOFILE={{ kamailio_open_files }}
    mode: "0644"

# Same limit on the running Kamailio, no restart (prlimit changes a live process's rlimit).
# Prints the pids it raised; nothing to do once every process has the limit.
- name: Kamailio open-files limit on the running processes
  ansible.builtin.shell: |
    set -eu
    for p in $(pgrep -u kamailio -x kamailio || true); do
      soft=$(prlimit --pid "$p" --nofile --noheadings --output SOFT | tr -d ' ')
      if [ "$soft" != "{{ kamailio_open_files }}" ]; then
        prlimit --pid "$p" --nofile={{ kamailio_open_files }}:{{ kamailio_open_files }}
        echo "raised $p"
      fi
    done
  register: kamailio_live_nofile
  changed_when: "'raised' in kamailio_live_nofile.stdout"

- name: Start Kamailio
  ansible.builtin.systemd:
    name: kamailio
    enabled: true
    state: started
    daemon_reload: true
