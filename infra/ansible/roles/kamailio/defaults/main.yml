---
# SIP history (kamailio.cfg sipdump). Hours kept by the hourly pbx-sipdump-prune timer. Changing
# these never touches kamailio.cfg (fage there is a fixed 24 h backstop), so no Kamailio restart.
# Was 24 h until 2026-11-22: at ~0.9 GB/h of REGISTER-heavy traffic edge-2 held 18 GB and hit
# the 70 % disk alert.
kamailio_sipdump_dir: /var/log/pbx/sipdump
kamailio_sipdump_keep_hours: 12
# Size cap for the folder (GB); the prune timer deletes the oldest hours above it, so a traffic
# spike can't fill the 32 GB root disk before the hours run out.
kamailio_sipdump_max_gb: 10

# Open files for every Kamailio process (systemd LimitNOFILE + prlimit on the running ones). The
# TCP main process needs one per connection: keep this well above kamailio_tcp_max_connections
# (16384). Debian's default soft limit of 1024 took TLS down on edge-2 on 2026-11-23.
kamailio_open_files: 65536

# UDP receive buffer per Kamailio socket (bytes): net.core.rmem_default + kamailio.cfg maxbuffer.
# 208 KB (kernel default) overflowed at the 2026-11-24 morning peak (tasks/udp-buffers.yml).
# 4 MB holds a few thousand SIP packets. Takes effect at Kamailio's next restart.
kamailio_udp_rcvbuf: 4194304
kamailio_udp_rmem_max: 8388608
