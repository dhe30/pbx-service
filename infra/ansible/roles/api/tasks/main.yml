---
# API (services/api) on the app nodes, built on the host from the repo and run by systemd, like the
# ARI app. HAProxy on the edges routes HTTPS to <private_ip>:{{ api_port }} and health-checks /ready.
# Migrations are NOT run here: the db_schema role runs dbmate once against the current primary
# earlier in site.yml (split-contracts.md §5), before any API node is updated (serial: 1).

- name: Required settings are filled in
  ansible.builtin.assert:
    that:
      - did_provider_url is match('^https?://')
      - (did_trunk_group_id | length > 0) != (did_trunk_id | length > 0)
      - vault_jwt_secret | length >= 16
      - vault_did_api_key | length > 0 and vault_did_api_key != 'CHANGE_ME'
      - vault_stripe_secret_key | length > 0 and vault_stripe_secret_key != 'CHANGE_ME'
      - vault_stripe_publishable_key | length > 0 and vault_stripe_publishable_key != 'CHANGE_ME'
      - (vault_operator_token | default('')) | length >= 32 and not (vault_operator_token is match('CHANGE_ME'))
    fail_msg: >-
      Set did_provider_url and exactly one of did_trunk_group_id / did_trunk_id (group_vars/all/main.yml),
      and vault_jwt_secret, vault_did_api_key, vault_stripe_secret_key, vault_stripe_publishable_key
      (vault.yml; values from the Course Services tab), and vault_operator_token (openssl rand -hex 32;
      the provider's view of all accounts' support tickets).

- name: NodeSource apt key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    mode: "0644"

- name: NodeSource apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: "deb [signed-by=/usr/share/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main\n"
    mode: "0644"

- name: Install Node.js {{ node_major }}, ffmpeg (greeting conversion) and rsync
  ansible.builtin.apt:
    name: [nodejs, ffmpeg, rsync]
    update_cache: true

- name: Service user
  ansible.builtin.user:
    name: pbx-api
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/opt/pbx/src, /etc/pbx]

# Whole repo minus heavy/irrelevant dirs (npm workspaces need every package.json to be present).
- name: Sync source
  ansible.posix.synchronize:
    src: "{{ repo_root }}/"
    dest: /opt/pbx/src/
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=dist"
      - "--exclude=infra"
      - "--exclude=loadtest"
      - "--exclude=dev"
      - "--exclude=.env"
      - "--exclude=telephony/tests/.rendered"  # test renders (incl. a test TLS key)
  register: api_src

- name: Check for a previous build
  ansible.builtin.stat:
    path: /opt/pbx/src/services/api/dist/index.js
  register: api_dist

- name: Install dependencies and build
  ansible.builtin.shell: |
    set -e
    npm ci --no-audit --no-fund -w @pbx/shared -w @pbx/api
    npm run build -w @pbx/shared -w @pbx/api
  args:
    chdir: /opt/pbx/src
    executable: /bin/bash
  when: api_src.changed or not api_dist.stat.exists
  notify: Restart api

- name: Environment file (contains secrets)
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/pbx/api.env
    owner: root
    group: pbx-api
    mode: "0640"
  notify: Restart api

- name: systemd unit
  ansible.builtin.template:
    src: pbx-api.service.j2
    dest: /etc/systemd/system/pbx-api.service
    mode: "0644"
  notify: Restart api

- name: Start API
  ansible.builtin.systemd:
    name: pbx-api
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

# serial: 1 in site.yml: the next app node is only touched once this one serves traffic again.
- name: Wait until the API is ready (DB + object store reachable)
  ansible.builtin.uri:
    url: "http://{{ private_ip }}:{{ api_port }}/ready"
  register: api_ready
  retries: 30
  delay: 2
  until: api_ready.status == 200
